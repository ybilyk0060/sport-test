<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow, noarchive">
<title>Тестова сторінка оплати</title>
<link rel="stylesheet" href="css/app.css?v=ec06824-mx0kgt9k">
<style>
  .test-banner { position: sticky; top: 0; z-index: 10; background: repeating-linear-gradient(45deg, #1d1b2f, #1d1b2f 14px, #3a3660 14px, #3a3660 28px); color: #ffe45c; text-align: center; font-weight: 800; letter-spacing: .08em; padding: calc(10px + env(safe-area-inset-top, 0px)) 10px 10px; }
  .rowline b { font-size: 18px; }
</style>
</head>
<body>
<div class="test-banner" id="banner"></div>
<main id="app"></main>
<script type="module">
// Тестовая страница оплаты. Настоящих платежей нет. Полей для карты здесь нет и быть не должно:
// у настоящего провайдера карта вводится на ЕГО странице.
import { T } from './js/i18n/index.js?v=ec06824-mx0kgt9k';
import { money } from './js/locale.js?v=ec06824-mx0kgt9k';
import { track } from './js/store.js?v=ec06824-mx0kgt9k';
const P = T.payTest;
const q = new URLSearchParams(location.search);
const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
// Возврат — только на этот же сайт
let ret = new URL('index.html', location.href);
try { const r = new URL(q.get('return') || '', location.href); if (r.origin === location.origin) ret = r; } catch { /* оставляем адрес по умолчанию */ }
const go = (status) => { ret.searchParams.set('pay', status); ret.searchParams.set('order', q.get('order') || ''); location.href = ret.toString(); };
document.getElementById('banner').textContent = P.banner;
document.title = P.title;
document.getElementById('app').innerHTML = `<section class="screen"><h1 class="rtitle">${esc(P.title)}</h1><p>${esc(P.lead)}</p>
  <div class="box"><div class="rowline"><span>${esc(P.order)}</span><span class="small muted">${esc(q.get('order') || '—')}</span></div>
  <div class="rowline"><span>${esc(q.get('desc') || '')}</span></div><div class="rowline"><span>${esc(P.amount)}</span><b>${esc(money(Number(q.get('amount') || 0)))}</b></div></div>
  <p class="small muted">${esc(P.subNote)}</p>
  <div class="grow"></div><button class="btn" id="ok">${esc(P.pay)}</button><button class="btn ghost" id="no">${esc(P.cancel)}</button></section>`;
track('pay_page_shown', { test: true });
document.getElementById('ok').onclick = () => go('paid');
document.getElementById('no').onclick = () => go('cancelled');
</script>
</body>
</html>
