<script>(function(){try{var q=new URLSearchParams(location.search);if(q.get('sub')||q.get('s')||q.get('pay')||q.get('_ptxn'))return;var st=null;try{st=localStorage.getItem('sporttest.v1.state')}catch(e){}if(st){var o=JSON.parse(st);if(!o||o.results||(o.step&&o.step!=='landing'))return}var D={"langs":["en","de","uk"],"linkOnly":["uk"],"t":{"en":"\u003csection class=\"screen\">\u003cdiv class=\"langs top\">\u003ca href=\"?lang=en\" class=\"on\">English\u003c/a>\u003ca href=\"?lang=de\" class=\"\">Deutsch\u003c/a>\u003c/div>\u003cdiv class=\"hero hero-vid\">\u003cdiv class=\"hero-vwrap\">\u003cimg class=\"hero-video\" src=\"assets/landing/hero-moves.jpg\" alt=\"\" aria-hidden=\"true\">\u003cspan class=\"hv-badge\">🔒 Video never leaves your phone\u003c/span>\u003c/div>\u003cdiv class=\"hv-text\">\u003ch1>Which sport fits your kid?\u003c/h1>\u003cp class=\"promise\">A 3-minute test in front of your phone’s camera shows your child’s strengths and 3 sports to try.\u003c/p>\u003c/div>\u003c/div>\n    \u003c!-- Кнопка сразу под обещанием (реклама 27.11: в окне Facebook её закрывал баннер cookie, на iPhone SE она была ниже края) -->\n    \u003cbutton class=\"btn\" data-act=\"start\">Start the test\u003c/button>\n    \u003cul class=\"points\">\u003cli>7 quick questions\u003c/li>\u003cli>4–5 short exercises, about 3 minutes\u003c/li>\u003cli>Video stays on your phone — nothing is uploaded\u003c/li>\u003c/ul>\u003cdiv class=\"trust-box\">\u003cspan class=\"tb-ic\" aria-hidden=\"true\">🏅\u003c/span>\u003cspan>One-leg balance is adapted from EUROFIT, the Council of Europe youth fitness test.\u003c/span>\u003c/div>\u003cdiv class=\"grow\">\u003c/div>\n    \u003cp class=\"small muted center land-note\">You’ll need a phone with a camera and about 6×6 ft (2×2 m) of clear space. A playful movement test, not a medical assessment.\u003c/p>\u003cp class=\"small muted center land-note\">Adapted for a phone camera at home, so results are a guide, not a lab measurement.\u003c/p>\u003c/sectio edizinische Untersuchung.\u003c/p>\u003cp class=\"small muted center land-note\">Für die Handykamera zu Hause angepasst, die Ergebnisse sind eine Orientierung, keine Labormessung.\u003c/p>\u003c/section>","uk":"\u003csection class=\"screen\">\u003cdiv class=\"langs top\">\u003ca href=\"?lang=en\" class=\"\">English\u003c/a>\u003ca href=\"?lang=de\" class=\"\">Deutsch\u003c/a>\u003ca href=\"?lang=uk\" class=\"on\">Українська\u003c/a>\u003c/div>\u003cdiv class=\"hero\">\u003cdiv class=\"hero-art\">\u003csvg viewBox=\"0 0 240 200\" role=\"img\" aria-hidden=\"true\">\u003cellipse cx=\"120\" cy=\"178\" rx=\"92\" ry=\"12\" fill=\"#ffe7d1\"/>\u003ccircle cx=\"60\" cy=\"52\" r=\"20\" fill=\"#ffd9b0\"/>\u003ccircle cx=\"190\" cy=\"36\" r=\"10\" fill=\"#ffe7d1\"/>\u003cg transform=\"translate(120 112) scale(2.6)\">\u003ccircle cx=\"0\" cy=\"-22\" r=\"6.5\" fill=\"#ff7a1a\"/>\u003cpath d=\"M0-15V5M0-10l-13-9M0-10l13-9M0 5l-10 15M0 5l10 15\" stroke=\"#ff7a1a\" stroke-width=\"4.2\" stroke-linecap=\"round\" fill=\"none\"/>\u003c/g>\u003cpath d=\"M196 96l4 9 10 1-8 7 2 10-8-5-9 5 3-10-8-7 10-1z\" fill=\"#ffc400\"/>\u003cpath d=\"M38 110l3 6 7 1-5 5 1 7-6-4-6 4 1-7-5-5 7-1z\" fill=\"#ffc400\"/>\u003c/svg>\u003c/div>\u003ch1>Який спорт підходить вашій дитині?\u003c/h1>\u003cp class=\"promise\">Тест на 3 хвилини перед камерою телефона покаже сильні сторони дитини і 3 види спорту, які варто спробувати.\u003c/p>\u003c/div>\n    \u003c!-- Кнопка сразу под обещанием (реклама 27.11: в окне Facebook её закрывал баннер cookie, на iPhone SE она была ниже края) -->\n    \u003cbutton class=\"btn\" data-act=\"start\">Почати\u003c/button>\n    \u003cul class=\"points\">\u003cli>7 коротких запитань\u003c/li>\u003cli>4–5 коротких вправ, близько 3 хвилин\u003c/li>\u003cli>Відео обробляється на телефоні й нікуди не надсилається\u003c/li>\u003c/ul>\u003cdiv class=\"trust-box\">\u003cspan class=\"tb-ic\" aria-hidden=\"true\">🏅\u003c/span>\u003cspan>Тест рівноваги на одній нозі адаптовано з EUROFIT — тесту фізичної підготовки дітей Ради Європи.\u003c/span>\u003c/div>\u003cdiv class=\"grow\">\u003c/div>\n    \u003cp class=\"small muted center land-note\">Потрібні телефон із камерою та вільне місце 2×2 м. Ігровий тест руху, не медичне обстеження.\u003c/p>\u003cp class=\"small muted center land-note\">Пристосовано для камери телефону вдома, тож результат — орієнтир, а не лабораторний вимір.\u003c/p>\u003c/section>"}},l=q.get('lang');if(!(l&&D.t[l])){l=null;try{var s=localStorage.getItem('sporttest.lang');if(s&&D.t[s])l=s}catch(e){}}if(!l){var n=navigator.languages||[navigator.language];for(var i=0;i<n.length&&!l;i++){var c=String(n[i]||'').slice(0,2).toLowerCase();if((c==='uk'||c==='ru')&&D.t.uk&&D.linkOnly.indexOf('uk')<0)l='uk';else if(c==='de'&&D.t.de)l='de';else if(c==='en'&&D.t.en)l='en'}}if(!l)l=D.langs[0];var a=document.getElementById('app');a.innerHTML=D.t[l];document.documentElement.lang=l;window.__ktShell=l;a.onclick=function(e){var b=e.target.closest&&e.target.closest('[data-act="start"]');if(b){window.__ktStart=1;b.classList.add('wait')}}}catch(e){}})();</script>
